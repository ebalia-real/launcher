name: Live mod data
# Every hour: EBALIA's mods as CurseForge and Modrinth show them now (downloads, names, pictures, new mods), read by the
# site and the launcher from raw.githubusercontent.com/ebalia-real/launcher/live/mods.json. site-src/live.py writes it;
# it goes alone onto the live branch, which is replaced each time, so no history piles up. Nothing else runs on that
# branch: the build workflows only follow main and the version tags.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read the stores
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 site-src/live.py "$RUNNER_TEMP/live/mods.json"
      - name: Publish on the live branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/live"
          printf '%s\n' "EBALIA's mods as CurseForge and Modrinth show them, refreshed every hour by .github/workflows/live-data.yml on main." > README.md
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods.json README.md
          git commit -q -m "Live mod data"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
